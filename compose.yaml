name: fitnessbytes

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: ./fitness-bytes-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5301
      DB_URL: mongodb://mongo:27017/fitnessbytes
      SECRETKEY: ${SECRETKEY:-replace-this-before-public-use}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_MAX_AGE: ${COOKIE_MAX_AGE:-86400000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-12mb}
    expose:
      - "5301"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5301/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./fitness-bytes-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/
      VITE_SOCKET_URL: ""
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${PUBLIC_HOSTNAME:-localhost}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    expose:
      - "5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
    labels:
      com.cloudflare.tunnel-id: ${CLOUDFLARE_TUNNEL_ID:-unset}
    command:
      - tunnel
      - --no-autoupdate
      - run
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mongo-data:
